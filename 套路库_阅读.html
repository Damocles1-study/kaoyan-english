<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语一 · 阅读解题套路库</title>
<style>
  :root{
    --bg:#faf9f6; --card:#ffffff; --ink:#2b2b2b; --muted:#8a8578;
    --accent:#8b5e34; --accent-soft:#f3e9dd; --line:#e8e3d8;
    --green:#3e7a4e; --green-soft:#e8f2ea; --blue:#3d6a8a; --blue-soft:#e7eff5;
    --purple:#6d5a8e; --purple-soft:#eeeaf5; --amber:#a5732a; --amber-soft:#f6ecd8;
    --serif:"Georgia","Songti SC",serif; --sans:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;
    --mono:"SF Mono","JetBrains Mono","Menlo",monospace;
  }
  @media (prefers-color-scheme: dark){:root{
    --bg:#1c1a17; --card:#26231f; --ink:#e8e4dc; --muted:#9a948a;
    --accent:#d0a06a; --accent-soft:#3a3127; --line:#3a362f;
    --green:#7fb98d; --green-soft:#26362b; --blue:#8ab3d0; --blue-soft:#26323d;
    --purple:#a996c8; --purple-soft:#302a3d; --amber:#d9ad61; --amber-soft:#38301f;
  }}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.8;padding-bottom:60px}
  .wrap{max-width:880px;margin:0 auto;padding:24px 20px}
  a.back{font-size:.85rem;color:var(--muted);text-decoration:none}
  a.back:hover{color:var(--accent)}
  header{margin:12px 0 6px}
  header h1{font-family:var(--serif);font-size:1.65rem}
  header .sub{color:var(--muted);margin-top:6px;font-size:.9rem}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0;position:sticky;top:0;
    background:var(--bg);padding:8px 0;z-index:5;border-bottom:1px solid var(--line)}
  .bar button{font-size:.84rem;border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:8px;padding:5px 12px;cursor:pointer}
  .bar button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .bar input{flex:1;min-width:180px;border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:8px;padding:6px 12px;font-size:.86rem}
  .bar .sp{flex:1}
  .legend{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;
    margin-bottom:16px;font-size:.85rem;color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0;
    border-left:4px solid var(--accent)}
  .card h3{font-size:1.02rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card h3 .cid{font-size:.72rem;font-family:var(--mono);color:var(--muted);border:1px solid var(--line);
    border-radius:5px;padding:1px 6px}
  .card h3 .qt{font-size:.72rem;background:var(--purple-soft);color:var(--purple);border-radius:5px;padding:1px 8px}
  .chips{margin:8px 0}
  .chip{display:inline-block;font-size:.76rem;background:var(--accent-soft);color:var(--accent);
    border-radius:20px;padding:2px 10px;margin:3px 4px 0 0}
  .body{margin-top:6px}
  .body.fold{display:none}
  .lbl{font-size:.74rem;color:var(--muted);letter-spacing:.06em;margin:12px 0 3px}
  .flow{font-size:.92rem}
  .tmpl{background:var(--blue-soft);border-radius:10px;padding:10px 14px;font-size:.9rem;margin-top:3px}
  .trap{background:var(--amber-soft);border-radius:8px;padding:7px 12px;font-size:.86rem;margin:6px 0}
  .trap::before{content:"⚠️ ";}
  .refs{margin-top:12px;font-size:.85rem}
  .refs a{display:inline-block;color:var(--accent);text-decoration:none;border:1px solid var(--line);
    border-radius:6px;padding:2px 9px;margin:3px 6px 0 0}
  .refs a:hover{background:var(--accent-soft)}
  code{font-family:var(--mono);font-size:.86em;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:1px 5px}
  b{color:var(--ink)}
  table.tk{border-collapse:collapse;width:100%;font-size:.84rem;margin:4px 0}
  table.tk th,table.tk td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
  table.tk th{background:var(--accent-soft);color:var(--accent);white-space:nowrap}
  .peek{font-size:.8rem;color:var(--muted);cursor:pointer;user-select:none}
  footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 返回英语一复盘中心</a>
  <header>
    <h1>阅读解题套路库</h1>
    <div class="sub">「看到什么信号 → 用什么套路」· 全部提炼自已复盘的 <b>2022 Text 1–4 · 2007 Text 1–4 · 2007/2022 新题型</b> 真题技巧与干扰项分析 · 每张卡链回原题 · 借鉴 408 复盘中心套路库</div>
  </header>

  <div class="legend">
    <b>怎么用：</b>先看卡片顶部的<b>识别信号</b>，在心里把「该用什么定位法、正确项/错误项长什么样」讲一遍，再点<b>「看套路 ▾」</b>验证；做题卡壳时反过来用——把题目里的信号词丢进搜索框。🔴必用 · 🟡常用 · 🟢信号灯。
  </div>

  <div class="bar">
    <button data-f="all" class="on">全部</button>
    <button data-f="🔴">🔴 必用</button>
    <button data-f="🟡">🟡 常用</button>
    <button data-f="🟢">🟢 信号灯</button>
    <input id="q" placeholder="搜信号词，如「例证」「人名」「末段」「限定段落」…">
    <button id="expand">全部展开</button>
  </div>

  <div id="cards"></div>
  <footer id="foot"></footer>
</div>

<script src="data_tricks_read.js"></script>
<script>
const wrap=document.getElementById('cards');
let filter='all', open=false;

function cardHtml(t){
  let h='<div class="card" data-tier="'+t.tier+'" data-text="'+(t.title+' '+t.qt+' '+t.trig.join(' ')).replace(/"/g,'')+'">';
  h+='<h3><span class="cid">'+t.id+'</span>'+t.tier+' '+t.title+'<span class="qt">'+t.qt+'</span></h3>';
  h+='<div class="chips">';t.trig.forEach(x=>h+='<span class="chip">'+x+'</span>');h+='</div>';
  h+='<span class="peek">看套路 ▾</span>';
  h+='<div class="body fold">';
  h+='<div class="lbl">定位与判定</div><div class="flow">'+t.flow+'</div>';
  if(t.tmpl)h+='<div class="lbl">正确项 / 错误项的长相</div><div class="tmpl">'+t.tmpl+'</div>';
  if(t.traps&&t.traps.length){h+='<div class="lbl">陷阱</div>';t.traps.forEach(x=>h+='<div class="trap">'+x+'</div>');}
  if(t.refs&&t.refs.length){h+='<div class="refs"><b>练这些题 →</b> ';
    t.refs.forEach(r=>h+='<a href="'+r.p+'#'+r.q+'">'+r.label+'</a>');h+='</div>';}
  h+='</div></div>';
  return h;
}
function render(){
  const kw=document.getElementById('q').value.trim().toLowerCase();
  let n=0,html='';
  TRICK_READ.forEach(t=>{
    if(filter!=='all'&&t.tier!==filter)return;
    const blob=(t.title+' '+t.qt+' '+t.trig.join(' ')+' '+t.flow).toLowerCase();
    if(kw&&blob.indexOf(kw)<0)return;
    n++;html+=cardHtml(t);
  });
  wrap.innerHTML=html||'<div class="legend">没有匹配的套路卡。</div>';
  wrap.querySelectorAll('.peek').forEach(p=>p.onclick=()=>{
    const b=p.nextElementSibling;const f=b.classList.toggle('fold');p.textContent=f?'看套路 ▾':'收起 ▴';});
  if(open)wrap.querySelectorAll('.body').forEach((b,i)=>{b.classList.remove('fold');b.previousElementSibling.textContent='收起 ▴';});
  document.getElementById('foot').textContent=n+' 张套路卡 · 源：'+TRICK_READ_META.source+' · '+TRICK_READ_META.note;
}
document.querySelectorAll('.bar button[data-f]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.bar button[data-f]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');filter=b.dataset.f;render();});
document.getElementById('q').oninput=render;
document.getElementById('expand').onclick=function(){open=!open;this.textContent=open?'全部折叠':'全部展开';render();};
render();
</script>
</body>
</html>
